<div class="container-fluid m-0 p-0 d-flex align-items-center justify-content-center">
  <div class="input-form p-5 col-lg-4 col-md-6 col-sm-7 col-xs-6">
    <form [formGroup]="form" (ngSubmit)="update()" accept-charset="utf-8" htmlEscape="true" enctype="multipart/form-data" method="POST">
      <div class="text-center mb-20">
        <h4 class="text-header">Order Update</h4>
      </div>
      <div class="p-4">
        <!-- Order Date -->
        <mat-form-field appearance="outline">
          <mat-label>Order Date</mat-label>
          <input matInput [matDatepicker]="picker" formControlName="orderDate" readonly>
          <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
          <mat-datepicker #picker disabled="false"></mat-datepicker>
        </mat-form-field>
        <mat-error *ngIf="form.controls['orderDate'].invalid && (form.controls['orderDate'].touched || form.controls['orderDate'].dirty || submitted)">
          <span *ngIf="form.controls['orderDate'].errors?.['required']" class="d-block">Field is required.</span>
        </mat-error>
        <!-- Customer -->
        <mat-form-field appearance="outline">
          <mat-label>Customer</mat-label>
          <mat-select formControlName="customer">
            <mat-form-field>
              <input type="text" matInput [(ngModel)]="searchText" [ngModelOptions]="{ standalone: true }" placeholder="Search..."/>
            </mat-form-field>
            <mat-option>None</mat-option>
            <mat-option *ngFor="let customer of customerList | search : searchText" [value]="customer.id">{{ customer.name }}</mat-option>
          </mat-select>
        </mat-form-field>
        <mat-error *ngIf="form.controls['customer'].invalid && (form.controls['customer'].touched || form.controls['customer'].dirty || submitted)">
          <span *ngIf="form.controls['customer'].errors?.['required']" class="d-block">Field is required.</span>
        </mat-error>
        <!-- Remark -->
        <mat-form-field appearance="outline">
          <mat-label>Remark</mat-label>
          <input type="text" matInput formControlName="remark">
        </mat-form-field>
        <div class="button-group">
          <button mat-raised-button color="primary" type="submit" class="text-white">Update</button>
          <button mat-raised-button color="warn" type="button" class="text-white" (click)="reset()">Reset</button>
          <button mat-raised-button color="accent" type="button" class="text-white" (click)="back()">Back</button>
        </div>
      </div>
    </form>
  </div>
</div>
